<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRACE H.Q.</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <aside class="side-menu">
      <div class="side-menu-header">TRACE H.Q.</div>
      <nav>
        <a href="#/" class="nav-item" data-route="home">Home</a>
        <a href="#/workflows" class="nav-item" data-route="workflows">Workflows</a>
        <a href="#/settings" class="nav-item" data-route="settings">Settings</a>
      </nav>
      <div class="project-switcher" id="project-switcher" style="display: none;">
        <label for="project-select">Project</label>
        <select id="project-select"></select>
      </div>
    </aside>
    <main class="main-content">
      <div id="view-home" class="view hidden">
        <h1>Welcome to TRACE H.Q.</h1>
        <p>Use the side menu to open <strong>Workflows</strong> (project board) or <strong>Settings</strong>.</p>
      </div>
      <div id="view-workflows" class="view hidden">
        <div id="board-container"></div>
      </div>
      <div id="view-settings" class="view hidden">
        <div id="settings-container"></div>
      </div>
      <div id="toast" class="toast hidden" aria-live="polite"></div>
    </main>
  </div>
  <script src="/js/settings.js"></script>
  <script src="/js/story-card.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
