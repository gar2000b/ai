<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRACE H.Q.</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <aside class="side-menu">
      <div class="side-menu-header">TRACE H.Q.</div>
      <nav>
        <a href="#/" class="nav-item" data-route="home">Home</a>
        <a href="#/workflows" class="nav-item" data-route="workflows">Workflows</a>
        <a href="#/backlog" class="nav-item" data-route="backlog">Backlog</a>
        <a href="#/settings" class="nav-item" data-route="settings">Settings</a>
      </nav>
    </aside>
    <main class="main-content">
      <div id="view-home" class="view hidden">
        <h1>Welcome to TRACE H.Q.</h1>
        <p>Use the side menu to open <strong>Workflows</strong> (project board), <strong>Backlog</strong>, or <strong>Settings</strong>.</p>
      </div>
      <div id="view-workflows" class="view hidden">
        <header class="workflows-header">
          <h1 class="workflows-title">Project board</h1>
          <div class="workflows-header-actions">
            <div class="project-switcher project-switcher--header">
              <label for="project-select" class="project-switcher__label">Project</label>
              <select id="project-select" class="project-switcher__select" aria-label="Select project"></select>
            </div>
            <button type="button" id="create-project-btn" class="btn-create-project">Create <span class="btn-shortcut">P</span>roject</button>
            <button type="button" id="create-story-btn" class="btn-create-story">Create story <span class="btn-shortcut">(C)</span></button>
          </div>
        </header>
        <div id="board-container"></div>
      </div>
      <div id="view-backlog" class="view hidden">
        <header class="workflows-header">
          <h1 class="workflows-title">Backlog</h1>
          <p class="workflows-subtitle">Stories not in any workflow. Add to any project’s workflow below.</p>
        </header>
        <div id="backlog-container"></div>
      </div>
      <div id="view-settings" class="view hidden">
        <div id="settings-container"></div>
      </div>
      <div id="toast" class="toast hidden" aria-live="polite"></div>
    </main>
  </div>
  <script src="/js/settings.js"></script>
  <script src="/js/story-card.js"></script>
  <script src="/js/story-edit-modal.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/backlog.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
